# ============================================================================
# GlobalSend Java Application Configuration
# Advanced Java Project
# ============================================================================

server.port=8080
app.contextPath=/

# Database Configuration
# Supported types: 'auto' (detects MySQL, falls back to SQLite), 'mysql', 'sqlite'
db.type=auto
db.mysql.url=jdbc:mysql://localhost:3306/globalsend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.mysql.username=root
db.mysql.password=

# SQLite fallback path (used when MySQL is offline or for portable evaluation)
db.sqlite.url=jdbc:sqlite:.data/globalsend.db

# HikariCP Connection Pool Settings
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=5000
db.pool.idleTimeout=30000

# File Storage Configuration (Java NIO)
storage.upload.dir=.data/uploads
storage.max.file.size.bytes=52428800
# 50MB maximum upload limit

# Vault Expiration Concurrency Service (ScheduledExecutorService)
expiration.cleanup.interval.seconds=60
expiration.default.duration.seconds=86400
